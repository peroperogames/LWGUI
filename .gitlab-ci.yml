stages:
  - prepare
  - sysnc
  - analysis
  - test_editor
  - test_play
  - del_unityeditor
  - analysis_again
  - clear
  - publish
# #变量定义：
variables:
  #  项目名称
  BUILD_NAME: chongxi-test
  IMAGE_VERSION: 1 
  UNITY_VERSION: 2019.4.32f1 #2019.4.32f1
  UNITY_DIR: $CI_PROJECT_DIR # this needs to be an absolute path. Defaults to the root of your tree.
  VERSION_NUMBER_VAR: $CI_COMMIT_REF_SLUG-$CI_PIPELINE_ID-$CI_JOB_ID
  VERSION_BUILD_VAR: $CI_PIPELINE_IID
  GRADLE_USER_HOME: $CI_PROJECT_DIR/GRADLE
  LC_ALL: "en_US.UTF-8"
  LANG: "en_US.UTF-8"
  WinDEMOPATH: "C:/Tool_EmptyDemo/$CI_PROJECT_NAME/WinDEMOPATHs_$CI_PIPELINE_IID"
  AndroidDEMOPATH: "C:/Tool_EmptyDemo/$CI_PROJECT_NAME/AndroidDEMOPATHs_$CI_PIPELINE_IID"
  iOSDEMOPATH: "C:/Tool_EmptyDemo/$CI_PROJECT_NAME/iOSDEMOPATHs_$CI_PIPELINE_IID"
  WebGLDEMOPATH: "C:/Tool_EmptyDemo/$CI_PROJECT_NAME/WebGLDEMOPATHs_$CI_PIPELINE_IID"
  SwitchDEMOPATH: "C:/Tool_EmptyDemo/$CI_PROJECT_NAME/SwitchDEMOPATHs_$CI_PIPELINE_IID"
###################################################################################

#################################################  创建新的unity项目  ##############
prepare:
  stage: prepare
  before_script:
    - echo $CI_COMMIT_REF_NAME
#Batch scripts that can delete files created 2 hours ago

    - ./ci~/delete.sh
  script:
    - echo "当前.用户名： $env:UserName"
    - ./ci~/NewDemo.bat
    - cp -r -force . $WinDEMOPATH/Packages/Tools/
    - cp -r -force . $AndroidDEMOPATH/Packages/Tools/
    - cp -r -force . $iOSDEMOPATH/Packages/Tools/
    - cp -r -force . $WebGLDEMOPATH/Packages/Tools/
    - cp -r -force . $SwitchDEMOPATH/Packages/Tools/
  after_script:
    - Copy-Item -Path $manifest -Destination "$env:WinDEMOPATH\Packages\manifest.json" -Force
    - Copy-Item -Path $manifest -Destination "$env:AndroidDEMOPATH\Packages\manifest.json" -Force
    - Copy-Item -Path $manifest -Destination "$env:iOSDEMOPATH\Packages\manifest.json" -Force
    - Copy-Item -Path $manifest -Destination "$env:WebGLDEMOPATH\Packages\manifest.json" -Force
    - Copy-Item -Path $manifest -Destination "$env:SwitchDEMOPATH\Packages\manifest.json" -Force
  tags:
    - tools-sonar
  only:
    refs:
    - tags
    - merge_requests

#################################################  同步操作->生成程序集  ##############
Sysnc:
  stage: sysnc
  script:
    - ./ci~/sync_vs.bat
  after_script:
    - echo $pwd
    - New-Item -ItemType Directory -Path $CI_PROJECT_DIR\artifacts\sync_log\ -Force
    - Copy-Item -Path "C:\Tool_EmptyDemo\$CI_PROJECT_NAME\SysnsLog\$CI_PIPELINE_IID" -Destination $CI_PROJECT_DIR\artifacts\sync_log\ -Recurse -Force
  tags:
    - tools-sonar
  when: on_success
  # allow_failure: true  
  artifacts:
    paths:
    - artifacts\sync_log
    expire_in: 1 week
  only:
    refs:
    - tags
    - merge_requests


#################################################  第一次sonarqube分析  ##############
analysis_Win:
  stage: analysis
  before_script:
    - git config --system core.longpaths true
    # - ./ci~/Win_sync_vs.bat
    #用于启用 Git 仓库中文件路径长度大于 260 字符的支持。
  script:
    - echo "当前.用户名： $env:UserName"
    - echo $PWD
    - cd $WinDEMOPATH
    - SonarScanner.MSBuild.exe begin
      /k:"$SONAR_PROJECT_KEYS"
      /d:sonar.host.url="$SONAR_HOST_URL"
      /d:sonar.branch.name="$CI_COMMIT_REF_NAME -Win"
      /d:sonar.login="$SONAR_TOKEN"
      /v:"$CI_COMMIT_TAG"
      /d:sonar.exclusions=Assets/**/Plugins/**/*
    - MSBuild.exe WinDEMOPATHs_$CI_PIPELINE_IID.sln /t:Rebuild /m
    - SonarScanner.MSBuild.exe end /d:sonar.login="$SONAR_TOKEN"
  after_script:
    - New-Item -ItemType Directory -Path $CI_PROJECT_DIR\artifacts\sonar_Win\ -Force
    - Copy-Item -Path $WinDEMOPATH\.sonarqube\out\0\ProjectInfo.xml -Destination $CI_PROJECT_DIR\artifacts\sonar_Win\ -Recurse -Force
    # - Copy-Item -Path "$env:CI_PROJECT_DIR\manifest.json" -Destination "$env:WinDEMOPATH\Packages\manifest.json" -Force
  tags:
    - tools-sonar
  allow_failure: true
  artifacts:
    paths:
    - artifacts\sonar_Win\ProjectInfo.xml
    expire_in: 1 week
  only:
    refs:
    - tags
    - merge_requests


